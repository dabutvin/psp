name: CI

on:
  pull_request:
    paths:
      - "server/**"
      - "PSPClassifieds/**"

jobs:
  server-test:
    name: Server — Tests
    if: contains(join(github.event.pull_request.labels.*.name, ','), '') || true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v

  server-docker:
    name: Server — Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t psp-api:ci ./server

  ios-build-and-test:
    name: iOS — Build & Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: PSPClassifieds
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build and run tests
        run: |
          xcodebuild test \
            -project PSPClassifieds.xcodeproj \
            -scheme PSPClassifieds \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
